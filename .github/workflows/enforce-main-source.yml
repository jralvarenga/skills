name: Enforce main source

# pull_request_target runs main's copy of this file, so a PR cannot edit the
# check to pass. Only read PR metadata here; never check out PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions: {}

jobs:
  main-only-from-next:
    runs-on: ubuntu-latest
    steps:
      - name: Require next from this repository
        env:
          EXPECTED_REF: next
          EXPECTED_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "$EXPECTED_REF" ] || [ "$HEAD_REPO" != "$EXPECTED_REPO" ]; then
            echo "::error::Pull requests into main must come from the next branch on this repository."
            echo "Expected head: ${EXPECTED_REPO}:${EXPECTED_REF}"
            echo "Actual head:   ${HEAD_REPO}:${HEAD_REF}"
            echo "Open feature work against next. Release by merging next into main."
            exit 1
          fi

          echo "PR into main is from ${HEAD_REPO}:${HEAD_REF}."
